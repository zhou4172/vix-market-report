name: Build and deploy VIX report

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data/cboe_vix_cache
          key: ${{ runner.os }}-vix-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-vix-data-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build latest report
        run: >-
          python market_condition_report.py
          --source cboe
          --output site/index.html
          --cache-dir data/cboe_vix_cache

      - name: Validate report
        run: |
          test -s site/index.html
          grep -q "Official Cboe EOD" site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
